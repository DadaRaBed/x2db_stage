name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy openpyxl pywebview weasyprint reportlab pdfkit Pillow pyinstaller
    
    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name="DataManager" --add-data "web;web" --add-data "data;data" --add-data "services;services" --add-data "repositories;repositories" app.py
    
    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: DataManager-Windows
        path: dist/DataManager.exe
        if-no-files-found: error
