name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write          # <-- OBLIGATOIRE pour creer la release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update APP_VERSION from tag
        shell: bash
        run: |
          VERSION=${{ github.ref_name }}
          VERSION=${VERSION#v}
          sed -i "s/^APP_VERSION = .*/APP_VERSION = \"$VERSION\"/" app.py
          grep '^APP_VERSION' app.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Convert icon
        run: python convert_icon.py

      - name: Build with PyInstaller
        run: pyinstaller build.spec -- --onefile

      # ✅ CETTE ETAPE ATTACHE L'EXE A LA RELEASE
      - name: Create Release with EXE
        uses: softprops/action-gh-release@v2
        with:
          files: dist/xl2db.exe
          name: xl2db ${{ github.ref_name }}
          body: |
            ## Version ${{ github.ref_name }}
            
            Telechargez `xl2db.exe` ci-dessous pour mettre a jour.
          draft: false
          prerelease: false
